{{- range $name, $port := dict "ingest" 8001 "api" 8000 "web" 8080 }}
---
apiVersion: v1
kind: Service
metadata: { name: voltpath-{{ $name }}, labels: { app: voltpath-{{ $name }} } }
spec:
  selector: { app: voltpath-{{ $name }} }
  ports: [{ port: {{ $port }}, targetPort: {{ $port }} }]
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voltpath
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: voltpath-api, port: { number: 8000 } } } }
          - { path: /.well-known, pathType: Prefix, backend: { service: { name: voltpath-api, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: voltpath-web, port: { number: 8080 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voltpath-oem
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.oemMtls.enabled }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ .Values.ingress.oemMtls.caSecret | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.oemHost | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.ingress.oemHost | quote }}
      http:
        paths:
          - { path: /v1/oem, pathType: Prefix, backend: { service: { name: voltpath-ingest, port: { number: 8001 } } } }
{{- end }}
