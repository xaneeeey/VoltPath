{{- $root := . -}}
{{- range $name, $cfg := dict "ingest" (dict "cmd" "voltpath.ingest" "port" 8001 "v" .Values.ingest "workersEnv" "INGEST_WORKERS")
                           "processor" (dict "cmd" "voltpath.processor" "port" 9100 "v" .Values.processor)
                           "lake-writer" (dict "cmd" "voltpath.processor.lake" "port" 9100 "v" .Values.lakeWriter)
                           "api" (dict "cmd" "voltpath.api" "port" 8000 "v" .Values.api "workersEnv" "API_WORKERS") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltpath-{{ $name }}
  labels: {{- include "vp.labels" $root | nindent 4 }}
    app: voltpath-{{ $name }}
spec:
  replicas: {{ $cfg.v.replicas }}
  selector: { matchLabels: { app: voltpath-{{ $name }} } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: voltpath-{{ $name }}, app.kubernetes.io/part-of: voltpath }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: {{ $cfg.port | quote }} }
    spec:
      terminationGracePeriodSeconds: 45     # processors commit offsets / ingest flushes the producer
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway,
            labelSelector: { matchLabels: { app: voltpath-{{ $name }} } } }
      containers:
        - name: {{ $name }}
          image: {{ $root.Values.image.python }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["python", "-m", "{{ $cfg.cmd }}"]
          env:
            {{- include "vp.env" $root | nindent 12 }}
            {{- if $cfg.workersEnv }}
            - { name: {{ $cfg.workersEnv }}, value: {{ $cfg.v.workers | quote }} }
            {{- end }}
          envFrom: {{- include "vp.envFrom" $root | nindent 12 }}
          ports: [{ containerPort: {{ $cfg.port }} }]
          {{- if or (eq $name "ingest") (eq $name "api") }}
          readinessProbe: { httpGet: { path: /readyz, port: {{ $cfg.port }} }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: {{ $cfg.port }} }, periodSeconds: 10, failureThreshold: 6 }
          {{- end }}
          resources: {{- toYaml $cfg.v.resources | nindent 12 }}
          {{- include "vp.securityContext" $root | nindent 10 }}
          volumeMounts: {{- include "vp.mounts" $root | nindent 12 }}
      volumes: {{- include "vp.volumes" $root | nindent 8 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltpath-web
  labels: {{- include "vp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app: voltpath-web } }
  template:
    metadata: { labels: { app: voltpath-web, app.kubernetes.io/part-of: voltpath } }
    spec:
      containers:
        - name: web
          image: {{ .Values.image.web }}
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 } }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
