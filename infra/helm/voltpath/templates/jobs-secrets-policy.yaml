# Pre-install/upgrade hook: migrations + topic/bucket bootstrap (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: voltpath-init-{{ .Release.Revision }}
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.image.python }}
          command: ["python", "-m", "voltpath.init"]
          env: {{- include "vp.env" . | nindent 12 }}
          envFrom: {{- include "vp.envFrom" . | nindent 12 }}
          volumeMounts: {{- include "vp.mounts" . | nindent 12 }}
      volumes: {{- include "vp.volumes" . | nindent 8 }}
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: voltpath-batch }
spec:
  schedule: {{ .Values.batch.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: batch
              image: {{ .Values.image.python }}
              command: ["python", "-m", "voltpath.batch", "all"]
              env: {{- include "vp.env" . | nindent 16 }}
              envFrom: {{- include "vp.envFrom" . | nindent 16 }}
              resources: {{- toYaml .Values.batch.resources | nindent 16 }}
              volumeMounts: {{- include "vp.mounts" . | nindent 16 }}
          volumes: {{- include "vp.volumes" . | nindent 12 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: voltpath-models }
spec: { accessModes: [ReadWriteMany], resources: { requests: { storage: 2Gi } } }
{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: voltpath-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target: { name: voltpath-secrets }
  dataFrom: [{ extract: { key: {{ .Values.externalSecrets.remoteKey | quote }} } }]
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Default deny; only the ingress controller reaches ingest/api/web, and app pods reach data services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: voltpath-default-deny }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: voltpath } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
{{- end }}
