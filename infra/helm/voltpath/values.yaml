# Cloud-agnostic: every environment difference is a value (endpoints, secrets, classes), never code.
image:
  python: ghcr.io/voltpath/python:1.0.0
  web: ghcr.io/voltpath/web:1.0.0
  pullPolicy: IfNotPresent

env: prod
# Managed services (RDS/Cloud SQL/Azure PG with timescaledb+vector, MSK/Confluent/Event Hubs-Kafka,
# ElastiCache/Memorystore, S3/GCS) are referenced by endpoint; the chart does not run stateful infra.
endpoints:
  kafkaBootstrap: b-1.voltpath-msk.internal:9094
  redisUrl: rediss://voltpath-redis.internal:6379/0
  s3Endpoint: https://s3.ap-south-1.amazonaws.com
  lakeBucket: voltpath-lake-prod

# Secrets come from the cloud secret manager via External Secrets Operator (Vault / AWS SM / GCP SM).
externalSecrets:
  enabled: true
  secretStoreRef: { name: cloud-secrets, kind: ClusterSecretStore }
  remoteKey: voltpath/prod
  # keys: DATABASE_URL, APP_DATABASE_URL, S3_ACCESS_KEY, S3_SECRET_KEY, OEM_SECRETS, ANTHROPIC_API_KEY, jwt_private.pem

ingest:
  replicas: 4
  workers: 4
  resources: { requests: { cpu: "2", memory: 512Mi }, limits: { cpu: "4", memory: 1Gi } }
  hpa: { min: 4, max: 24, cpuTarget: 65 }
processor:
  replicas: 6          # <= topic partitions (12)
  resources: { requests: { cpu: "1", memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
  keda: { enabled: true, lagThreshold: "50000", min: 3, max: 12 }
lakeWriter:
  replicas: 2
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "1", memory: 3Gi } }
api:
  replicas: 3
  workers: 4
  resources: { requests: { cpu: "1", memory: 768Mi }, limits: { cpu: "2", memory: 1536Mi } }
  hpa: { min: 3, max: 12, cpuTarget: 60 }
web:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }
batch:
  schedule: "0 */6 * * *"
  resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "4", memory: 8Gi } }

ingress:
  enabled: true
  className: nginx
  host: voltpath.example.com
  tlsSecret: voltpath-tls           # cert-manager issued; TLS 1.3 only (annotation below)
  oemHost: ingest.voltpath.example.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    cert-manager.io/cluster-issuer: letsencrypt
  # Optional mutual TLS for OEM cloud connectors (in addition to HMAC signatures)
  oemMtls: { enabled: true, caSecret: voltpath/oem-client-ca }

podSecurity:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
networkPolicy:
  enabled: true
