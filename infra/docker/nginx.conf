# SPA + reverse proxy to the API (same origin: no CORS, WebSocket upgrade for /v1/ws/*)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' ws: wss: https://tiles.openfreemap.org; worker-src 'self' blob:; frame-ancestors 'none'" always;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /.well-known/ { proxy_pass http://api:8000; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /maplibre/ { expires 7d; types { text/javascript mjs; } try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
