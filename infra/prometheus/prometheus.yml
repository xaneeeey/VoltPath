global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ingest
    static_configs: [{ targets: ["ingest:8001"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  # compose replicas are discovered through Docker's embedded DNS (one A record per replica)
  - job_name: processor
    dns_sd_configs: [{ names: ["processor"], type: A, port: 9100 }]
  - job_name: lake-writer
    static_configs: [{ targets: ["lake-writer:9100"] }]
  - job_name: simulator
    static_configs: [{ targets: ["simulator:9101", "simulator:9102", "simulator:9103", "simulator:9104"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
