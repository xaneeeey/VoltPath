[project]
name = "voltpath"
version = "1.0.0"
description = "VoltPath - EV charging & battery-health intelligence for connected fleets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    "numpy>=2.0",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "confluent-kafka>=2.5",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
    "sqlmodel>=0.0.22",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "prometheus-client>=0.20",
    "anthropic>=0.40",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers[postgres,redis,kafka]>=4.8",
    "behave>=1.2.6",
    "ruff>=0.6",
    "locust>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltcore", "src/voltpath"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/contract"]
asyncio_mode = "auto"
markers = [
    "integration: needs docker (Testcontainers)",
]
addopts = "-q"

[tool.coverage.run]
source = ["src/voltcore", "src/voltpath"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "S608", "S104"]
